name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout the exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Test diagnostic behavior
        run: just test

      - name: Test macOS system Bash compatibility
        if: runner.os == 'macOS'
        run: just test-bash /bin/bash

      - name: Smoke-test the composite action
        uses: ./
        timeout-minutes: 2

      - name: Install development tools
        if: runner.os == 'macOS'
        run: brew bundle

      - name: Run pre-commit checks
        if: runner.os == 'macOS'
        run: just hooks

      - name: CI failure diagnostics
        if: failure()
        uses: ./
        timeout-minutes: 2

  ci-required-check:
    name: CI - Required Check
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the CI jobs failed or was cancelled."
          exit 1

      - name: Check test completion
        if: needs.test.result != 'success'
        run: |
          echo "All tests must complete successfully."
          exit 1
