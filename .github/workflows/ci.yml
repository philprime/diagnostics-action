name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout the exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Test diagnostic behavior
        run: just test

      - name: Test macOS system Bash compatibility
        if: runner.os == 'macOS'
        run: just test-bash /bin/bash

      - name: Smoke-test the composite action
        uses: ./

      - name: Observe real Xcode destination commands
        if: runner.os == 'macOS'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const directory = path.join(process.env.RUNNER_TEMP, 'xcode-probe');
            fs.mkdirSync(directory, { recursive: true });
            const probe = path.join(directory, 'xcodebuild');
            fs.copyFileSync('tests/xcodebuild-probe.sh', probe);
            fs.chmodSync(probe, 0o755);
            core.exportVariable('REAL_XCODEBUILD', execFileSync('/usr/bin/xcrun', ['--find', 'xcodebuild'], { encoding: 'utf8' }).trim());
            core.exportVariable('XCODE_DESTINATION_RESULTS', path.join(directory, 'results'));
            core.addPath(directory);

      - name: Test real project destinations through the action
        if: runner.os == 'macOS'
        uses: ./
        with:
          project: tests/fixtures/Diagnostics.xcodeproj
          scheme: Diagnostics

      - name: Test real workspace destinations through the action
        if: runner.os == 'macOS'
        uses: ./
        with:
          workspace: tests/fixtures/Diagnostics.xcworkspace
          scheme: Diagnostics

      - name: Verify both destination checks succeeded
        if: runner.os == 'macOS'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const results = fs.readFileSync(process.env.XCODE_DESTINATION_RESULTS, 'utf8').trim().split('\n');
            if (results.length !== 2 || results.some(result => result !== '0')) {
              core.setFailed('Both project and workspace destination commands must run and succeed.');
            }

      - name: Install development tools
        if: runner.os == 'macOS'
        run: brew bundle

      - name: Run pre-commit checks
        if: runner.os == 'macOS'
        run: just hooks

      - name: CI failure diagnostics
        if: failure()
        uses: ./

  ci-required-check:
    name: CI - Required Check
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the CI jobs failed or was cancelled."
          exit 1

      - name: Check test completion
        if: needs.test.result != 'success'
        run: |
          echo "All tests must complete successfully."
          exit 1
