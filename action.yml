name: "diagnostics"
author: "Philip Niedertscheider"
description: "Emit best-effort system and Xcode diagnostics on macOS and Linux without containers"
branding:
  icon: "activity"
  color: "blue"

inputs:
  workspace:
    description: "Xcode workspace path, relative to the working directory or absolute. Takes precedence over project. Requires scheme to list destinations."
    required: false
  project:
    description: "Xcode project path, relative to the working directory or absolute. Requires scheme to list destinations."
    required: false
  scheme:
    description: "Xcode scheme used to list available destinations when workspace or project is supplied. Ignored on Linux."
    required: false

runs:
  using: "composite"
  steps:
    - name: Emit diagnostics
      shell: bash
      env:
        DIAGNOSTICS_ACTION_PATH: ${{ github.action_path }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_SCHEME: ${{ inputs.scheme }}
      run: bash "$DIAGNOSTICS_ACTION_PATH/scripts/main.sh"
